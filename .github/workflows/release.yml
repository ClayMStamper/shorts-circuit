name: Release

# Builds the Windows installer. Run it by hand (Actions → Release → Run workflow) for a test
# build, or push a tag like v0.2.0 to also attach the installer to a draft GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ("v$($conf.version)" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match tauri.conf.json version $($conf.version)"
          }

      # A repository variable FFMPEG_SHA256 pins the download; without it the script checks
      # against the checksum Gyan.dev publishes.
      - name: Fetch FFmpeg
        shell: pwsh
        env:
          FFMPEG_SHA256: ${{ vars.FFMPEG_SHA256 }}
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build the installer
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: shorts-circuit-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $files --draft --title "Shorts Circuit ${{ github.ref_name }}" --notes "Unsigned Windows build. Windows SmartScreen may warn on first run; choose More info, then Run anyway."
