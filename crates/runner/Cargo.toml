shorts-adapters.workspace = true
shorts-cloud.workspace = true
shorts-domain.workspace = true
shorts-publish.workspace = true
shorts-scheduler.workspace = true
sqlx = { workspace = true, features = ["postgres", "uuid"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
