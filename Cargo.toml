[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri shell has its own lockfile and needs WebView system libraries; CI checks it on Windows.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ClayMStamper/shorts-circuit"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10", features = ["serde"] }
hex = "0.4"
notify = "8"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

shorts-adapters = { path = "crates/adapters" }
shorts-desktop = { path = "crates/desktop" }
shorts-domain = { path = "crates/domain" }
shorts-media = { path = "crates/media" }
shorts-scheduler = { path = "crates/scheduler" }
shorts-store = { path = "crates/store" }
