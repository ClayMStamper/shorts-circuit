[package]
name = "shorts-circuit-app"
description = "Tauri 2 desktop shell for Shorts Circuit."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ClayMStamper/shorts-circuit"
publish = false

[lib]
name = "shorts_circuit_app"
path = "src/lib.rs"

[[bin]]
name = "shorts-circuit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shorts-adapters = { path = "../../crates/adapters" }
shorts-desktop = { path = "../../crates/desktop" }
shorts-domain = { path = "../../crates/domain" }
shorts-media = { path = "../../crates/media" }
shorts-scheduler = { path = "../../crates/scheduler" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
